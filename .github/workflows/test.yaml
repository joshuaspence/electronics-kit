---
name: 'Test'

on:
  pull_request: {}
  push:
    branches: ['master']

permissions:
  contents: 'read'

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  # The one name the `master` ruleset requires, however the jobs below grow.
  all:
    name: 'Test'
    needs: ['unit', 'e2e']
    if: 'always()'
    runs-on: 'ubuntu-latest'
    steps:
      - if: "needs.unit.result != 'success' || needs.e2e.result != 'success'"
        run: 'exit 1'

  unit:
    name: 'Unit Test'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@v7.0.1'
      - uses: 'pnpm/action-setup@v6.0.10'
      - uses: 'actions/setup-node@v7.1.0'
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: 'pnpm install --frozen-lockfile'
      - run: 'pnpm test'

  # GitHub appends the matrix values, so these run as `E2E Test (chromium)` and `E2E Test (webkit)`.
  e2e:
    name: 'E2E Test'
    runs-on: 'ubuntu-latest'
    strategy:
      fail-fast: false
      matrix:
        browser:
          - 'chromium'
          - 'webkit'
    steps:
      - uses: 'actions/checkout@v7.0.1'
      - uses: 'pnpm/action-setup@v6.0.10'
      - uses: 'actions/setup-node@v7.1.0'
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: 'pnpm install --frozen-lockfile'
      - run: 'pnpm exec playwright install --with-deps ${{ matrix.browser }}'
      - run: 'pnpm test:e2e --project ${{ matrix.browser }}'

      - uses: 'actions/upload-artifact@v7.0.2'
        if: 'failure()'
        with:
          name: 'playwright-report-${{ matrix.browser }}'
          path: 'playwright-report'
          retention-days: 14
