name: Lint

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The one name the `master` ruleset requires, however the matrix below grows.
  all:
    name: Lint
    needs: lint
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: needs.lint.result != 'success'
        run: exit 1

  lint:
    name: ${{ matrix.script }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        script:
          - lint:js
          - lint:markdown
          - lint:prettier
          - typecheck
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ${{ matrix.script }}
